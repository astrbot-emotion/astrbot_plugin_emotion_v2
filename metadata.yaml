name: astrbot_plugin_emotion_v2
display_name: 情绪系统 v2
short_desc: 四层情绪引擎（判定→模糊→情绪→语气），带底/冲衰减与多标签判定
desc: |
  给聊天机器人一套会自己变化、且能被测量的情绪。四层结构，只有一层碰模型：

    ① 判定层：对方这句话是什么情绪（多标签）
              词义 + 语义（句式结构）+ 语境（前几句）三方仲裁，
              可同时点亮多个标签（如「分离担忧」一次给出忧/思/哀/惧）
    ② 模糊层：她"说不上来"的感受，19 个词 × 0~10
              按判定分滑动累加（滑动变量，不是阈值命中）
    ③ 情绪层：她自己的七情（喜/怒/哀/乐/惧/思/忧）
              每种拆「底」（天级）与「冲」（分钟级），会衰减、会互相压制
    ④ 语气层：十一个杠杆（句长/连发/反问/语气词/称呼/沉默…）
              翻译成一段文字，追加进本次 system_prompt

  注入只作用于当次请求：不写人格文件、不碰记忆库、不改变长期设定。
  面板可一键关闭（状态存 inject.json，重启不丢）。

  多会话隔离：每个对话独立计算自己的情绪，面板可切换查看。
  运行数据写在 plugin_data/astrbot_plugin_emotion_v2/，
  每天一个 JSONL 记录「他这句话被判成什么」和「她因此变成了什么情绪」。
version: 3.1.0
author: emotion-v2 contributors
astrbot_version: ">=4.16"
tags:
  - 情绪
  - 系统提示词
  - 独立会话
  - 可视化
