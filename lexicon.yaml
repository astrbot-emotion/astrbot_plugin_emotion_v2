    - 室友
    - 女生
    - 男生
    - 家里人
    - 我妈
    - 我爸
    - 别人
  TIRED:
    说明: 累/困（心疼 + 忧）
    词:
    - 累
    - 困
    - 睡了
    - 撑不住
    - 没力气
    - 熬夜
  TECH:
    说明: 技术词（好奇）
    词:
    - 缓存
    - 模型
    - 架构
    - 代码
    - 接口
    - 记忆
    - 压缩
    - 神经元
    - 算法
  PRAISE_F:
    说明: 夸（羞）
    词:
    - 厉害
    - 聪明
    - 好会
    - 真棒
    - 懂事
  LETGO:
    说明: 放弃沟通（别扭 + 失落）
    词:
    - 随便你
    - 你开心就好
    - 随你
    - 无所谓
  SOOTHE_F:
    说明: 安抚（释然）
    词:
    - 别怕
    - 有我在
    - 我在的
    - 我在呢
    - 对不起
    - 逗你的
    - 不会的
  GAIN:
    说明: 各词每次增加的分
    词:
      委屈: 3
      不安: 3
      在意: 2
      试探: 2
      期待: 3
      失落: 4
      心疼: 3
      别扭: 2
      自责: 3
      羞: 2
      好奇: 2
      疏离: 2
      释然: 3
      倦: 2
      关心: 2
      求证: 2
      教育: 1
      害怕: 3
