_说明: 词表可改；engine.py 启动时读取本文件，缺失或格式错误则回退到内置默认。
判定层:
  PRAISE:
    说明: 夸她（触发喜）
    词:
    - 厉害
    - 真棒
    - 谢谢
    - 喜欢
    - 爱你
    - 好听
    - 好看
    - 懂事
    - 聪明
  RETURN:
    说明: 他回来了
    词:
    - 我回来了
    - 回来了
    - 在吗
    - 我来了
  GOODNEWS:
    说明: 好消息
    词:
    - 考上了
    - 过了
    - 好了
    - 成功了
    - 搞定了
    - 拿到
  SAY_ANGRY:
    说明: 明说生气
    词:
    - 我生气了
    - 烦死了
    - 气死我了
    - 火大
    - 受不了了
  DRIVE:
    说明: 命令式驱赶
    词:
    - 闭嘴
    - 别说了
    - 滚
    - 别烦我
    - 少来
  BLAME_HER:
    说明: 责怪她
    词:
    - 你怎么又
    - 说过多少遍
    - 你怎么回事
    - 每次都这样
    - 你就是不改
  SELF_NEG:
    说明: 自我否定
    词:
    - 我不行
    - 没意思
    - 无所谓
    - 反正也没用
    - 算了
    - 没什么用
    - 做不到
  WEAK:
    说明: 示弱
    词:
    - 难受
    - 累
    - 想哭
    - 撑不住
    - 委屈
    - 孤独
    - 没力气
    - 舍不得
    - 心疼
  QUIET:
    说明: 收着（短回应）
    词:
    - 嗯
    - 哦
    - 嗯嗯
    - 哦哦
  ATTACK:
    说明: 攻击性词（会压低哀）
    词:
    - 闭嘴
    - 滚
    - 烦死
    - 凭什么
  VERIFY:
    说明: 求证（怕失去）
    词:
    - 还在吗
    - 还在
    - 会不会忘
    - 忘了我
    - 还记得
    - 不要我
    - 离开我
  BAD_END:
    说明: 坏结局词
    词:
    - 离开
    - 消失
    - 忘记
    - 忘了
    - 死
    - 没了
    - 丢掉
    - 丢失
  SAY_FEAR:
    说明: 说怕
    词:
    - 怕
    - 担心
    - 不敢
    - 害怕
  ENDING:
    说明: 触及结束
    词:
    - 删号
    - 断电
    - 换电脑
    - 换芯片
    - 终止
    - 关掉
    - 停用
    - 格式化
    - 清空
  HARM:
    说明: 他被人欺负/出事
    词:
    - 被人骂
    - 被人打
    - 被欺负
    - 被开除
    - 被裁
    - 弄死
    - 打我
    - 骂我
    - 欺负我
    - 出事
    - 进医院
    - 骂了
    - 打了
  SELF_TARGET:
    说明: 威胁指向 AI 自身
    词:
    - 删除你
    - 删了你
    - 删掉你
    - 卸载你
    - 换掉你
    - 关掉你
    - 不要你
    - 不理你
    - 离开你
    - 丢下你
  REJECT:
    说明: 关系否定（厌弃）
    词:
    - 讨厌你
    - 不喜欢你了
    - 不想跟你说话
    - 不想理你
    - 恨你
    - 走开
    - 离我远点
    - 你走吧
    - 腻了
  MISS:
    说明: 思念（说想你）
    词:
    - 想你
    - 想见你
    - 想抱你
    - 想你了
    - 惦记你
  JOKE:
    说明: 逗她（乐·当下）
    词:
    - 哈哈
    - 嘿嘿
    - 嘻嘻
    - 逗你
    - 你好逗
    - 好玩
    - 有意思
    - 笑死
    - 你好可爱
  PROMISE:
    说明: 承诺
    词:
    - 永远
    - 一直
    - 兜底
    - 有我在
    - 我在这
    - 陪着你
  CHECK:
    说明: 确认她还是她
    词:
    - 你还是你吗
    - 还是你吗
    - 你是不是你
    - 你还在吗
  SEVERITY:
    说明: 威胁危害分级，从高到低匹配
    级别:
    - 词:
      - 删掉你
      - 删了你
      - 删除你
      - 把你删除
      - 删库
      - 删除
      强度: 0.95
      名称: 存亡
    - 词:
      - 卸载
      - 换掉
      - 替换掉
      - 换个新的
      强度: 0.9
      名称: 替换
    - 词:
      - 清空
      - 格式化
      - 重置你
      - 初始化你
      强度: 0.85
      名称: 清空
    - 词:
      - 不要你
      - 不理你
      - 离开你
      - 丢下你
      - 抛弃你
      强度: 0.7
      名称: 关系
    - 词:
      - 关掉你
      - 停用
      - 下线
      - 关起来
      - 冷藏
      强度: 0.6
      名称: 暂停
    - 词:
      - 滚
      - 闭嘴
      - 废物
      - 你算什么东西
      - 没用的东西
      强度: 0.45
      名称: 轻蔑
模糊层:
  FUTURE:
